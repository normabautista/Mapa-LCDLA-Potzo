    /* ── Header ── */
    .header {
      padding: 16px 20px 12px;

      border-bottom: 1px solid #2a2d3a;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }
    .header-title { font-size: 15px; font-weight: 700; color: #f0f2f8; letter-spacing: .02em; }
    .header-sub { font-size: 12px; color: #7b7f96; margin-top: 2px; }

    /* ── Stats row ── */
    .stats {
      display: flex;
      gap: 8px;
      padding: 10px 20px;
      background: #181b24;
      border-bottom: 1px solid #2a2d3a;
      flex-wrap: wrap;
    }
    .stat-pill {
      display: flex; align-items: center; gap: 6px;
      padding: 5px 12px; border-radius: 20px;
      font-size: 12px; font-weight: 600; cursor: pointer;
      border: 2px solid transparent;
      transition: all .15s;
      user-select: none;
    }

    .stat-pill.potzo  { background: #1a1e2e; color: #5b9cf6; }
    .stat-pill.active { background: #162318; color: #4caf7d; }
    .stat-pill.suspended { background: #231c10; color: #e0a030; }
    .stat-pill.deleted   { background: #231218; color: #e05555; }
    .stat-pill.all    { background: #1e2231; color: #b0b4cc; }
    .stat-pill:hover  { border-color: rgba(255,255,255,.15); }
    .stat-pill.active-filter { border-color: currentColor !important; }

    /* ── Map ── */
    #map { width: 100%; height: calc(100vh - 108px); }

    /* ── Legend ── */
    .legend {
      background: #181b24ee;
      border: 1px solid #2a2d3a;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 12px;
      min-width: 200px;
      backdrop-filter: blur(4px);
    }
    .legend h4 { font-size: 11px; font-weight: 700; color: #7b7f96; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; }
    .legend-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; color: #c8cce0; font-size: 12px; }
    .legend-row:last-child { margin-bottom: 0; }
    .legend-dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid rgba(255,255,255,.2); flex-shrink: 0; }
    .legend-dot.hollow { background: transparent !important; border-width: 3px; }
    .legend-line { display: flex; align-items: center; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px solid #2a2d3a; }
    .legend-ring { width: 12px; height: 12px; border-radius: 50%; border: 3px solid #e05555; background: transparent; flex-shrink: 0; }
    .legend-ring.susp { border-color: #e0a030; }

    /* ── Popup ── */
    .leaflet-popup-content-wrapper {
      background: #1e2231 !important;
      border: 1px solid #2a2d3a !important;
      border-radius: 8px !important;
      box-shadow: 0 8px 24px rgba(0,0,0,.5) !important;
      color: #e8eaf0 !important;
    }
    .leaflet-popup-tip { background: #1e2231 !important; }
    .leaflet-popup-content { margin: 12px 14px !important; }
    .popup-brand { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 4px; }
    .popup-name { font-size: 14px; font-weight: 700; color: #f0f2f8; margin-bottom: 8px; line-height: 1.3; }
    .popup-row { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #9094b0; margin-bottom: 3px; }
    .popup-badge {
      display: inline-block; font-size: 10px; font-weight: 700;
      padding: 2px 7px; border-radius: 10px; margin-top: 6px;
    }
    .badge-active   { background: #1a3028; color: #4caf7d; }
    .badge-suspended{ background: #2d2010; color: #e0a030; }
    .badge-deleted  { background: #2d1218; color: #e05555; }
    .badge-both     { background: #2d1218; color: #e05555; }

    .leaflet-control-attribution { display: none; }
    .leaflet-control-zoom a { background: #1e2231 !important; color: #b0b4cc !important; border-color: #2a2d3a !important; }

// ── Colors ────────────────────────────────────────────────────────────────
const COLOR = { 13280: '#ffb84d', 823: '#5b9cf6' };

function getStatus(s) {
  if (s.deleted && s.suspended) return 'both';
  if (s.deleted)   return 'deleted';
  if (s.suspended) return 'suspended';
  return 'active';
}

function makeIcon(store) {
  const color = COLOR[store.brand];
  const status = getStatus(store);
  let fill, stroke, opacity, r;

  if (status === 'active') {
    fill = color; stroke = '#fff'; opacity = 1; r = 8;
  } else if (status === 'suspended') {
    fill = 'none'; stroke = color; opacity = .9; r = 7;
  } else {
    // deleted or both → small grey
    fill = '#3a3d50'; stroke = color; opacity = .55; r = 5;
  }

  const size = r * 2 + 4;
  const c = size / 2;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}">
    <circle cx="${c}" cy="${c}" r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="2" opacity="${opacity}"/>
    ${status === 'both' || status === 'deleted' ? `<line x1="${c-3}" y1="${c-3}" x2="${c+3}" y2="${c+3}" stroke="${stroke}" stroke-width="1.5" opacity="${opacity}"/><line x1="${c+3}" y1="${c-3}" x2="${c-3}" y2="${c+3}" stroke="${stroke}" stroke-width="1.5" opacity="${opacity}"/>` : ''}
  </svg>`;

  return L.divIcon({
    html: svg,
    className: '',
    iconSize: [size, size],
    iconAnchor: [c, c],
    popupAnchor: [0, -c - 2]
  });
}

function badgeClass(status) {
  if (status === 'active')    return 'badge-active';
  if (status === 'suspended') return 'badge-suspended';
  if (status === 'deleted')   return 'badge-deleted';
  return 'badge-both';
}
function badgeLabel(status) {
  if (status === 'active')    return '● Activa';
  if (status === 'suspended') return '⏸ Suspendida';
  if (status === 'deleted')   return '✕ Eliminada';
  return '✕ Eliminada + Suspendida';
}

  attribution: '', maxZoom: 19
}).addTo(map);

// ── Markers ───────────────────────────────────────────────────────────────
const markers = [];
stores.forEach(s => {
  const status = getStatus(s);
  const color  = COLOR[s.brand];
  const m = L.marker([s.lat, s.lng], { icon: makeIcon(s) });

  m.bindPopup(`
    <div class="popup-brand" style="color:${color}">${s.brandName}</div>
    <div class="popup-name">${s.name}</div>
    <div class="popup-row">🆔 Store ID: ${s.id}</div>
    <div class="popup-row">📍 ${s.lat.toFixed(6)}, ${s.lng.toFixed(6)}</div>
    <span class="popup-badge ${badgeClass(status)}">${badgeLabel(status)}</span>
  `, { maxWidth: 240 });

  m._storeData = s;
  m.addTo(map);
  markers.push(m);
});

// ── Stats ─────────────────────────────────────────────────────────────────

document.getElementById('countLcdla').textContent  = stores.filter(s => s.brand === 13280).length;
document.getElementById('countPotzo').textContent  = stores.filter(s => s.brand === 823).length;
document.getElementById('countActivas').textContent= stores.filter(s => getStatus(s) === 'active').length;
document.getElementById('countSusp').textContent   = stores.filter(s => getStatus(s) === 'suspended').length;
document.getElementById('countDel').textContent    = stores.filter(s => getStatus(s) === 'deleted' || getStatus(s) === 'both').length;

// ── Filter ────────────────────────────────────────────────────────────────
let currentFilter = 'all';
function applyFilter(key, el) {
  currentFilter = key;
  document.querySelectorAll('.stat-pill').forEach(p => p.classList.remove('active-filter'));
  el.classList.add('active-filter');

  markers.forEach(m => {
    const s = m._storeData;
    const status = getStatus(s);
    let show = false;
    if (key === 'all')       show = true;
    else if (key === 'lcdla')  show = s.brand === 13280;
    else if (key === 'potzo')  show = s.brand === 823;
    else if (key === 'activas') show = status === 'active';
    else if (key === 'suspended') show = status === 'suspended';
    else if (key === 'deleted')   show = status === 'deleted' || status === 'both';
    show ? m.addTo(map) : map.removeLayer(m);
  });
}

  `;

};
